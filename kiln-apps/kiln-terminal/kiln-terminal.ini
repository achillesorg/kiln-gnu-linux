# Kiln Terminal default configuration (fork of foot). Copy to ~/.config/kiln-terminal/kiln-terminal.ini to customise.
# Colours: the built-in Kiln light/dark schemes follow ~/.config/glaze/colour-scheme (written by glaze-colour-scheme)
# and switch live on SIGUSR1 (dark) / SIGUSR2 (light) via `kiln-terminal-scheme`.
# Adding a [colors] section here switches the built-in schemes off.

[main]
term=foot
app-id=org.kiln.Terminal
title=Kiln Terminal
font=Noto Sans Mono:size=9, Liberation Mono:size=9
dpi-aware=no
pad=10x8
initial-window-size-chars=100x30
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[csd]
preferred=server
size=0
border-width=0

[bell]
urgent=no
command-focused=no

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}
