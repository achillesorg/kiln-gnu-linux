# Glaze-owned sway config.
#
# Installed to ~/.config/glaze/sway.conf by scripts/install-session.sh and passed
# to sway with `-c` by `glaze-session run --backend sway`. It deliberately does
# NOT include /etc/sway/config or /etc/sway/config.d/*:
#   * no `bar {}` block: the Glaze panel (glaze-shell) is the only bar;
#   * no `output * bg`, and swaybg disabled: the wallpaper is Glaze's job
#     (desktop layer, later milestone);
#   * glaze-session itself exports WAYLAND_DISPLAY/SWAYSOCK into the systemd
#     user manager, so the distribution's 50-systemd-user.conf is not needed.
# Colours follow the Clay light tokens (crates/glaze-design/src/theme.rs).

set $mod Mod4
set $term foot

# No swaybg process at all.
swaybg_command -

font pango:Noto Sans 10

# Stacking (floating) by default, like a classic desktop. Tiling stays
# available per window with $mod+Shift+space; a session-wide tiling toggle is
# planned (docs/decisions.md).
for_window [all] floating enable
default_border normal 6
default_floating_border normal 6
titlebar_padding 6 3
# No fixed size clamp (0 x 0 = the output size), so windows can be resized up
# to the whole screen. glaze-shell fits each new floating window into the work
# area above the taskbar instead (glaze_backend::sway::fit_command).
floating_maximum_size 0 x 0
floating_minimum_size 240 x 120
floating_modifier $mod normal
focus_follows_mouse no

# class                 border  backgr. text    indicator child_border
# Clay v2 tokens (crates/glaze-design): accent #D97757 / accent_text #2B1A12,
# panel #F5F2EA, hairline #CFC6B4. glaze-shell re-applies these from the live
# theme over IPC (dark scheme, Classic, user accents).
client.focused          #D97757 #FCFBF7 #2B2926 #D97757   #F4DED4
client.focused_inactive #CFC6B4 #F5F2EA #6B665C #F5F2EA   #F5F2EA
client.unfocused        #CFC6B4 #F5F2EA #6B665C #F5F2EA   #F5F2EA
client.urgent           #D97757 #B03A2E #2B2926 #B03A2E   #B03A2E
client.placeholder      #CFC6B4 #F5F2EA #6B665C #F5F2EA   #F5F2EA
client.background       #F5F2EA

# Keys.
bindsym $mod+Return exec $term
bindsym Ctrl+Alt+t exec $term
bindsym $mod+Shift+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaymsg exit

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4

# Resize: borders are 6 px wide so edges and corners are easy to grab with the
# mouse; $mod + right-drag also resizes from anywhere on the window, $mod +
# left-drag moves it.
# Minimise (sway has no real minimise): park in the scratchpad; the taskbar
# restores it. $mod+m minimises, $mod+Shift+m brings it back.
bindsym $mod+m move scratchpad
bindsym $mod+Shift+m scratchpad show

# Snapping from the keyboard (glaze-snap, work area = screen minus the taskbar).
# Drag-to-edge snapping needs the Glaze compositor (Sway has no drag events).
bindsym $mod+Left exec glaze-snap left
bindsym $mod+Right exec glaze-snap right
bindsym $mod+Up exec glaze-snap toggle-maximise
bindsym $mod+Down exec glaze-snap restore-or-minimise
bindsym $mod+Shift+Left exec glaze-snap topleft
bindsym $mod+Shift+Right exec glaze-snap topright
bindsym $mod+Ctrl+Left exec glaze-snap bottomleft
bindsym $mod+Ctrl+Right exec glaze-snap bottomright
bindsym $mod+Shift+Up exec glaze-snap top
bindsym $mod+Shift+Down exec glaze-snap bottom
bindsym $mod+c exec glaze-snap center
