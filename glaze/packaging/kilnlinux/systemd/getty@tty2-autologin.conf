# Glaze M4 test path: autologin glaze on tty2 (installed by scripts/vm/install-tty2.sh).
# ~/.bash_profile starts the Glaze compositor session there only while
# ~/.config/glaze/tty2-session exists and tty2 is the active VT.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin glaze --noclear %I $TERM
