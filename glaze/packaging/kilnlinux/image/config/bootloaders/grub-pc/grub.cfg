source /boot/grub/config.cfg

menuentry "Live (Kiln GNU/Linux)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@
	initrd @INITRD_LIVE@
}
menuentry "Live (safe graphics: nomodeset, Sway session)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ nomodeset kiln.session=sway
	initrd @INITRD_LIVE@
}
menuentry "Live to RAM (needs about 4 GB RAM)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd @INITRD_LIVE@
}
