---
# GRUB on both architectures. grub-efi-arm64 (arm64) or grub-efi-amd64 + grub-pc-bin (amd64) are already in the
# unpacked system (arch/<arch>.list), so nothing is downloaded. The fallback BOOTAA64.EFI/BOOTX64.EFI copy makes
# firmware without a writable boot menu (many VMs, some PCs) find Kiln anyway.
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "kiln"
installEFIFallback: true
