---
# Kiln GNU/Linux installer (Calamares 3.3). Installs the running live system: the live squashfs is unpacked to the
# target disk (unpackfs), live-only packages and files are removed, the chosen user gets sudo, Glaze starts on tty1 login.
# No display manager: Kiln logs in on the console and ~/.bash_profile (from /etc/skel) starts the Glaze session, so the
# displaymanager module is deliberately not in the sequence (Calamares would fail with no display manager installed).
modules-search: [ local ]

instances:
- id: kiln
  module: shellprocess
  config: shellprocess_kiln.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - shellprocess@kiln
  - contextualprocess
  - plymouthcfg
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: kiln

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
