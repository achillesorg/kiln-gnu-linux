---
# Kiln GNU/Linux disk layout. UEFI: GPT with an ESP at /boot/efi. BIOS (amd64 only): MBR/GPT + bios_grub as Calamares decides.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

# Partition table: unset on purpose, Calamares picks gpt on EFI and msdos on BIOS (amd64).
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

# Full-disk encryption: LUKS1 because GRUB unlocks /boot from the encrypted root (GRUB cannot read LUKS2/argon2).
enableLuksAutomatedPartitioning: true
luksGeneration: luks1
