---
# Kiln GNU/Linux post-install (runs inside the target after unpackfs, users and packages).
# The script lives in the live image, so it is part of the unpacked system; it deletes itself at the end.
# ${USER} is the login name entered on the Users page.
dontChroot: false
timeout: 300
script:
    - command: "/usr/lib/kiln/calamares-finalize ${USER}"
      timeout: 300
i18n:
    name: "Finishing Kiln GNU/Linux"
