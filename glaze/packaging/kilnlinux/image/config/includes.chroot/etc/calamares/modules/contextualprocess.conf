---
# "Log in automatically without asking for the password" on the Users page sets autoLoginUser in global storage.
# Kiln has no display manager, so this writes the tty1 getty autologin drop-in for that user instead
# (Glaze then starts from ~/.bash_profile, exactly as in the live session). Unchecked: the key is absent, nothing runs.
dontChroot: false
timeout: 30
autoLoginUser:
    "*": "/usr/lib/kiln/calamares-autologin ${USER}"
