---
# Kiln GNU/Linux: the user created here is the only login (root stays locked) and gets sudo.
# The live user "glaze" does not exist in the squashfs (live-config creates it at boot), so nothing needs removing here;
# shellprocess_kiln.conf still deletes it if found.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - sudo
    - audio
    - video
    - render
    - input
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner
autologinGroup: autologin
# Kiln has no display manager: "log in automatically" is honoured by contextualprocess_autologin.conf (tty1 autologin).
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root, nobody ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kiln"
    forbidden_names: [ localhost ]
