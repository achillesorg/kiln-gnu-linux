---
# Remove the live-only packages from the installed copy (and the installer itself).
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
    - try_remove:
        - live-boot
        - live-boot-initramfs-tools
        - live-boot-doc
        - live-config
        - live-config-systemd
        - live-config-doc
        - live-tools
        - calamares
        - calamares-settings-debian
