# Glaze bundled wallpapers. Original flat cut-paper artwork generated by
# scripts/gen-wallpapers.py (MIT OR Apache-2.0, see LICENSE.md).
# `file` is what the resolver (crates/glaze-common/src/wallpaper.rs) loads:
# a grain-baked PNG at 1920x1080 (landscape) or 1080x2340 (portrait).
# Extra keys (seed, source, renders) are ignored by the resolver; they
# record how to reproduce each file and which other sizes exist.
schema = 1

# ---- Hills: the original v1 sets, shipped unchanged (paper-hills is the default) ----

[[set]]
id = "paper-hills"
title = "Paper Hills"
description = "Layered paper-cut hills under a low clay sun."

[[set.variant]]
scheme = "light"
orientation = "landscape"
file = "paper-hills-light-desktop.svg"
width = 1920
height = 1080

[[set.variant]]
scheme = "light"
orientation = "portrait"
file = "paper-hills-light-mobile.svg"
width = 1080
height = 2340

[[set.variant]]
scheme = "dark"
orientation = "landscape"
file = "paper-hills-dark-desktop.svg"
width = 1920
height = 1080

[[set.variant]]
scheme = "dark"
orientation = "portrait"
file = "paper-hills-dark-mobile.svg"
width = 1080
height = 2340

