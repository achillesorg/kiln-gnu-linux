<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Battery">
  <title>Battery</title>
  <!-- Original Glaze artwork (MIT OR Apache-2.0). 24x24 grid, 2px stroke.
       The inner block is the charge level; a live battery widget is expected to
       pick a level icon (or scale this block) rather than show this glyph blindly. -->
  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="7.5" width="15" height="9" rx="2.5" />
    <path d="M20 11v2" />
  </g>
  <rect x="5" y="10" width="6" height="4" rx="1" fill="#000000" />
</svg>
